name: Build KidsTasks IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app for iOS 15+ (iPhone 7 Plus & iPhone 13+)
        run: |
          xcodebuild             -project KidsTasks.xcodeproj             -scheme KidsTasks             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KidsTasks.app Payload/
          zip -r KidsTasks.ipa Payload

      - name: Upload KidsTasks IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsTasks-ipa
          path: KidsTasks.ipa
          retention-days: 7
