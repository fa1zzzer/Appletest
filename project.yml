name: SmartAlarm
options:
  bundleIdPrefix: com.fazz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SmartAlarm:
    type: application
    platform: iOS
    sources: [SmartAlarm]
    info:
      path: SmartAlarm/Info.plist
      properties:
        CFBundleDisplayName: Smart Alarm
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fazz.smartalarm
