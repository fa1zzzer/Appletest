name: KidsTasks
options:
  bundleIdPrefix: com.fazz
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KidsTasks:
    type: application
    platform: iOS
    sources: [KidsTasks]
    info:
      path: KidsTasks/Info.plist
      properties:
        CFBundleDisplayName: Детские дела
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Для добавления дел голосом"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fazz.kidstasks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
